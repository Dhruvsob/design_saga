name: design-saga

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/documentdb/Dockerfile
    image: design-saga-postgres-documentdb:17-0.107.0-ferretdb-2.7.0-hardened
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

  ferretdb:
    build:
      context: .
      dockerfile: deploy/ferretdb/Dockerfile
    image: design-saga-ferretdb:2.7.0-hardened
    restart: unless-stopped
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      # Metrics/debug endpoints are not part of the ERP API and must never be
      # reachable from another container.
      FERRETDB_DEBUG_ADDR: 127.0.0.1:8088
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ferretdb:27017/
      DB_NAME: ${DB_NAME:-design_saga}
      ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      APP_BASE_URL: ${APP_BASE_URL:-https://gamaa.in}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ENCRYPTION_KEY: ${GOOGLE_CALENDAR_ENCRYPTION_KEY:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-https://gamaa.in/api/calendar/google/callback}
      ENABLE_SEED_DEMO: "false"
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      FILE_STORAGE_ROOT: /data/files
      FILE_STORAGE_MAX_BYTES: ${FILE_STORAGE_MAX_BYTES:-5368709120}
      FILE_STORAGE_TENANT_MAX_BYTES: ${FILE_STORAGE_TENANT_MAX_BYTES:-536870912}
    volumes:
      - ./data/files:/data/files
    depends_on:
      ferretdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *default-logging
    networks:
      - default
      - data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - default

  caddy:
    image: caddy:2.11.9-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - default

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  default:
  data:
    internal: true
