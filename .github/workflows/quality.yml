name: Quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: design_saga_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.production.txt
      - run: pip install -r requirements.production.txt pytest pytest-xdist
      - name: Run security and integrity regressions
        run: >-
          pytest -q
          tests/test_access_and_url_safety.py
          tests/test_financial_read_permissions.py
          tests/test_visibility_surfaces.py
          tests/test_tenant_lookup_scoping.py
          tests/test_repair_release_safety.py
          tests/test_purchase_safety.py
          tests/test_expense_safety.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test -- --max-warnings=0
      - run: npm run build
