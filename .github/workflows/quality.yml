name: Quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: design_saga_ci
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked credentials
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/scan-secrets.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.production.txt
      - run: pip install -r requirements.production.txt pytest pytest-xdist pip-audit
      - name: Audit Python production dependencies
        run: pip-audit -r requirements.production.txt
      - name: Run security and integrity regressions
        run: >-
          python -m pytest -q
          tests/test_access_and_url_safety.py
          tests/test_accounting_safety.py
          tests/test_financial_read_permissions.py
          tests/test_invoice_pdf_format.py
          tests/test_employee_corrections.py
          tests/test_salary_revision_corrections.py
          tests/test_vendor_document_corrections.py
          tests/test_vendor_commission_visibility.py
          tests/test_visibility_surfaces.py
          tests/test_tenant_lookup_scoping.py
          tests/test_auth_tenant_safety.py
          tests/test_password_policy.py
          tests/test_app_pin_lock.py
          tests/test_session_response_safety.py
          tests/test_rbac_session_safety.py
          tests/test_conversion_safety.py
          tests/test_repair_release_safety.py
          tests/test_purchase_safety.py
          tests/test_expense_safety.py
          tests/test_google_calendar.py
          tests/test_calendar_holiday_permission_revocation.py
          tests/test_notification_safety.py
          tests/test_notification_tenant_safety.py
          tests/test_monitor_safety.py
          tests/test_public_share_safety.py
          tests/test_attendance_safety.py
          tests/test_payroll_safety.py
          tests/test_vendor_payment_safety.py
          tests/test_download_safety.py
          tests/test_local_file_storage.py
          tests/test_accounting_source_integrity.py
          tests/test_money_footing.py
          tests/test_pdf_branding.py
          tests/test_cash_bank_consistency.py
          tests/test_project_phases.py
          tests/test_logo_normalize.py
          tests/test_consultancy_proposal.py
          tests/test_leave_privacy.py
          tests/test_subscription_readonly.py
          tests/test_calendar_scope.py
          tests/test_monthly_leave_allowance.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit Node production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --max-warnings=0
      - name: Frontend logic unit tests
        run: node --test src/lib/frontend-logic.test.mjs
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: design_saga_qa_e2e
      QA_SUPERADMIN_EMAIL: owner@qa.test
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.production.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate per-run QA secrets
        run: |
          echo "QA_PASSWORD=Qa-$(openssl rand -hex 12)-Zx9" >> "$GITHUB_ENV"
          echo "AUDIT_HMAC_KEY=$(openssl rand -hex 40)" >> "$GITHUB_ENV"
          echo "QA_PIN=$(shuf -i 1-9 -n 6 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: pip install -r backend/requirements.production.txt
      - working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Bootstrap QA platform owner
        working-directory: backend
        run: python scripts/qa_bootstrap.py
      - name: Start backend and frontend
        run: |
          mkdir -p "$RUNNER_TEMP/files"
          (cd frontend && npx vite build)
          (cd backend && SUPER_ADMIN_EMAILS="$QA_SUPERADMIN_EMAIL" FILE_STORAGE_ROOT="$RUNNER_TEMP/files" \
            CORS_ORIGINS="$E2E_BASE_URL" COOKIE_SECURE=false APP_ENV=development \
            BUSINESS_TIMEZONE=Asia/Kolkata APP_BASE_URL="$E2E_BASE_URL" PYTHONPATH=. \
            nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > ../backend.log 2>&1 &)
          (cd frontend && nohup npx vite preview --host 127.0.0.1 --port 5173 --strictPort > ../vite.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null "$E2E_BASE_URL/" && \
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/api/auth/me")" = 401 ] && exit 0; sleep 2; done
          tail -50 backend.log vite.log; exit 1
      - name: Browser E2E
        working-directory: frontend
        run: npx playwright test
