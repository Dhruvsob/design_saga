server {
    listen 80;
    server_name _;
    server_tokens off;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ^~ : API paths always go to the backend, even when they end in .png/.jpg
    # (otherwise the static-asset regex below wins and logos/uploads return 404).
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        # Backend permits 15 MiB files; leave room for multipart framing.
        client_max_body_size 16m;
    }

    # Dotfiles and config/backup-looking paths answer 404 instead of falling back
    # to the app shell (nothing real is served either way; this stops scanners
    # reporting /.env, /.git/HEAD or /backup.sql as "200").
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(env|ini|log|sql|bak|old|orig|swp|yml|yaml|toml|sh|py|php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
